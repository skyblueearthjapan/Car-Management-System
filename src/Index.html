<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両管理予約システム</title>
  <?!= include('css'); ?>
</head>
<body>
  <!-- ローディング -->
  <div id="loading" class="loading-overlay">
    <div class="loading-spinner"></div>
    <p>読み込み中...</p>
  </div>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-left">
      <h1 class="header-title">車両管理予約システム</h1>
    </div>
    <div class="header-center">
      <div class="week-tabs" id="weekTabs">
        <!-- 週タブがここに挿入される -->
      </div>
    </div>
    <div class="header-right">
      <!-- 将来の拡張用 -->
    </div>
  </header>

  <!-- サブヘッダー -->
  <div class="subheader">
    <div class="subheader-left">
      <span class="current-date" id="currentDateDisplay">-</span>
    </div>
    <div class="subheader-right">
      <span class="save-status" id="saveStatus">
        <span class="status-icon">✓</span>
        <span class="status-text">保存済み</span>
      </span>
      <div class="nav-buttons">
        <button class="btn btn-nav" id="btnPrevDay">◀ 前日</button>
        <button class="btn btn-nav" id="btnToday">今日</button>
        <button class="btn btn-nav" id="btnNextDay">翌日 ▶</button>
      </div>
    </div>
  </div>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <!-- 保有車両（owned） -->
    <section class="vehicle-section owned-section">
      <div class="vehicle-grid" id="ownedVehicles">
        <!-- 車両カードがここに挿入される -->
      </div>
    </section>

    <!-- 借用可能車両（borrowable） -->
    <section class="vehicle-section borrowable-section">
      <h3 class="section-title">たまに借りられる車</h3>
      <div class="vehicle-grid borrowable-grid" id="borrowableVehicles">
        <!-- 車両カードがここに挿入される -->
      </div>
    </section>
  </main>

  <!-- 予約モーダル -->
  <div class="modal-overlay" id="reservationModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">予約</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="reservationForm">
          <!-- 車両情報（読み取り専用） -->
          <div class="form-group">
            <label class="form-label">車両</label>
            <div class="form-value" id="formVehicleName">-</div>
            <input type="hidden" id="formVehicleId">
          </div>

          <!-- 日付範囲 -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="formStartDate">開始日 <span class="required">*</span></label>
              <input type="date" class="form-input" id="formStartDate" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="formEndDate">終了日 <span class="required">*</span></label>
              <input type="date" class="form-input" id="formEndDate" required>
            </div>
          </div>

          <!-- スロット -->
          <div class="form-group">
            <label class="form-label">時間帯 <span class="required">*</span></label>
            <div class="slot-buttons" id="slotButtons">
              <button type="button" class="slot-btn" data-slot="AM">
                <span class="slot-name">午前</span>
                <span class="slot-time">08:00-13:00</span>
              </button>
              <button type="button" class="slot-btn" data-slot="PM">
                <span class="slot-name">午後</span>
                <span class="slot-time">13:00-18:00</span>
              </button>
              <button type="button" class="slot-btn" data-slot="FULL">
                <span class="slot-name">終日</span>
                <span class="slot-time">08:00-18:00</span>
              </button>
            </div>
            <input type="hidden" id="formSlot">
          </div>

          <!-- 部署 -->
          <div class="form-group">
            <label class="form-label" for="formDept">部署 <span class="required">*</span></label>
            <select class="form-select" id="formDept" required>
              <option value="">選択してください</option>
            </select>
          </div>

          <!-- 氏名 -->
          <div class="form-group">
            <label class="form-label" for="formWorker">氏名 <span class="required">*</span></label>
            <select class="form-select" id="formWorker" required disabled>
              <option value="">部署を選択してください</option>
            </select>
            <input type="hidden" id="formWorkerCode">
          </div>

          <!-- 用途（任意） -->
          <div class="form-group">
            <label class="form-label" for="formPurpose">用途</label>
            <input type="text" class="form-input" id="formPurpose" placeholder="例: 現場訪問">
          </div>

          <!-- 行先（任意） -->
          <div class="form-group">
            <label class="form-label" for="formDestination">行先</label>
            <input type="text" class="form-input" id="formDestination" placeholder="例: ○○工場">
          </div>

          <!-- メモ（任意） -->
          <div class="form-group">
            <label class="form-label" for="formMemo">メモ</label>
            <textarea class="form-textarea" id="formMemo" rows="2" placeholder="備考があれば"></textarea>
          </div>

          <!-- エラーメッセージ -->
          <div class="form-error" id="formError" style="display: none;"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btnModalCancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="btnModalSubmit">予約する</button>
      </div>
    </div>
  </div>

  <!-- 予約詳細モーダル -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">予約詳細</h2>
        <button class="modal-close" id="detailModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">車両</span>
            <span class="detail-value" id="detailVehicle">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">期間</span>
            <span class="detail-value" id="detailPeriod">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">時間帯</span>
            <span class="detail-value" id="detailSlot">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">予約者</span>
            <span class="detail-value" id="detailReserver">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">用途</span>
            <span class="detail-value" id="detailPurpose">-</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">行先</span>
            <span class="detail-value" id="detailDestination">-</span>
          </div>
          <div class="detail-item full-width">
            <span class="detail-label">メモ</span>
            <span class="detail-value" id="detailMemo">-</span>
          </div>
        </div>
        <input type="hidden" id="detailReservationId">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btnDetailClose">閉じる</button>
        <button type="button" class="btn btn-danger" id="btnDetailCancel">予約をキャンセル</button>
      </div>
    </div>
  </div>

  <!-- 確認モーダル -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 class="modal-title">確認</h2>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">本当にキャンセルしますか？</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btnConfirmNo">いいえ</button>
        <button type="button" class="btn btn-danger" id="btnConfirmYes">はい</button>
      </div>
    </div>
  </div>

  <?!= include('js'); ?>
</body>
</html>
