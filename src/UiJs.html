<!-- UiJs.html -->
<script>
(() => {
  // ---------------------------
  // State
  // ---------------------------
  const S = {
    dateISO: null,
    vehicles: [],
    dayReservations: [],
    deptList: [],
    workersCache: new Map(), // dept -> workers[]
    confirmedVehicles: new Set(), // 警告確認済みの車両ID
  };

  // ---------------------------
  // Helpers (date)
  // ---------------------------
  const pad2 = (n) => String(n).padStart(2, '0');

  function isoToDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function dateToISO(dt){
    return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
  }
  function formatTitle(iso){
    const dt = isoToDate(iso);
    const y = dt.getFullYear();
    const m = dt.getMonth()+1;
    const d = dt.getDate();
    const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
    return `${y}-${pad2(m)}-${pad2(d)}（${dow}）`;
  }
  function startOfWeekISO(iso){
    // Monday-start week for UI (can adjust later)
    const dt = isoToDate(iso);
    const day = dt.getDay(); // 0 Sun ... 6 Sat
    const delta = (day === 0 ? -6 : 1 - day); // move to Monday
    dt.setDate(dt.getDate() + delta);
    return dateToISO(dt);
  }
  function addDaysISO(iso, n){
    const dt = isoToDate(iso);
    dt.setDate(dt.getDate() + n);
    return dateToISO(dt);
  }

  // ---------------------------
  // Helpers (toast / modal / save state)
  // ---------------------------
  const $ = (id) => document.getElementById(id);

  function setSaveState(mode){
    const el = $('saveState');
    if (mode === 'saving'){
      el.textContent = '保存中…';
      el.classList.remove('is-saved');
      el.classList.add('is-saving');
    } else {
      el.textContent = '保存済み';
      el.classList.remove('is-saving');
      el.classList.add('is-saved');
    }
  }

  function toast(title, msg){
    const host = $('toastHost');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<div class="toast__title">${escapeHtml(title)}</div>
                   <div class="toast__msg">${escapeHtml(msg || '')}</div>`;
    host.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(4px)';
      t.style.transition = 'opacity .18s ease, transform .18s ease';
    }, 2600);
    setTimeout(() => t.remove(), 3200);
  }

  function openModal(title, bodyHtml, footHtml){
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = bodyHtml;
    $('modalFoot').innerHTML = footHtml || '';
    $('modalOverlay').classList.remove('is-hidden');
  }
  function closeModal(){
    $('modalOverlay').classList.add('is-hidden');
    $('modalBody').innerHTML = '';
    $('modalFoot').innerHTML = '';
  }

  $('modalClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', (e) => {
    if (e.target === $('modalOverlay')) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function escapeHtml(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;');
  }

  // ---------------------------
  // SVG icons (ILLUST-BOX like, 5 styles)
  // ---------------------------
  function normalizeStyle(style){
    const s = String(style || '').toLowerCase();
    // 過去互換：van_box が残ってても吸収
    if (s === 'van_box') return 'van';
    return s;
  }

  function styleTag(rawStyle){
    const style = normalizeStyle(rawStyle);
    const map = {
      sedan: 'SEDAN',
      minivan: 'MINIVAN',
      van: 'VAN',
      kei_truck: 'KEI TRUCK',
      suv: 'SUV',
    };
    return map[style] || 'VEHICLE';
  }

  function inferStyleByName(name){
    const n = String(name || '');
    if (n.includes('軽トラ')) return 'kei_truck';
    if (n.includes('ハイエース')) return 'van';
    if (n.includes('ノア')) return 'minivan';
    if (n.includes('CX')) return 'suv';
    if (n.includes('カローラ')) return 'sedan';
    return 'sedan';
  }

  /**
   * ILLUST-BOX like silhouette:
   * - body: currentColor fill
   * - window: white with opacity
   * - wheels: white ring + body center
   * viewBox: 0 0 120 60
   */
  function svgIcon(rawStyle){
    const style = normalizeStyle(rawStyle);
    const wheel = (cx) => `
      <circle cx="${cx}" cy="48" r="10" fill="#fff"/>
      <circle cx="${cx}" cy="48" r="5" fill="currentColor"/>
    `;
    const glass = (d) => `<path d="${d}" fill="#fff" opacity="0.35"/>`;
    const wrect = (x,y,w,h,r=3) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" opacity="0.35"/>`;

    switch(style){

      // --- SEDAN (カローラなど)
      case 'sedan':
        return `
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="
            M14 44
            V36
            C14 33 16 31 19 31
            H32
            L40 20
            C42 17 45 16 49 16
            H74
            C78 16 81 17 83 20
            L90 31
            H101
            C104 31 106 33 106 36
            V44
            C106 46 104 48 102 48
            H18
            C16 48 14 46 14 44
            Z" />
          ${glass("M43 21 L50 31 H70 L79 21 C77 19 75 19 74 19 H49 C47 19 45 19 43 21 Z")}
          ${wheel(34)}
          ${wheel(86)}
        </svg>`;

      // --- MINIVAN (ノアなど) : 背が高く窓3枚
      case 'minivan':
        return `
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="
            M12 44
            V26
            C12 21 16 18 22 18
            H78
            C90 18 96 22 99 30
            L108 40
            V44
            C108 46 106 48 104 48
            H16
            C14 48 12 46 12 44
            Z" />
          ${wrect(22,23,16,16,3)}
          ${wrect(41,23,16,16,3)}
          ${wrect(60,23,16,16,3)}
          ${glass("M80 22 L100 40 H80 Z")}
          ${wheel(34)}
          ${wheel(86)}
        </svg>`;

      // --- VAN (ハイエース) : 箱型・後ろ角・窓2枚＋前面ガラス
      case 'van':
        return `
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="
            M10 44
            V20
            C10 16 13 14 18 14
            H82
            C96 14 103 18 106 28
            L112 40
            V44
            C112 46 110 48 108 48
            H14
            C12 48 10 46 10 44
            Z" />
          ${wrect(18,20,16,16,3)}
          ${wrect(37,20,16,16,3)}
          ${glass("M86 18 L106 40 H86 Z")}
          ${wheel(32)}
          ${wheel(90)}
        </svg>`;

      // --- KEI TRUCK (軽トラ) : 荷台＋キャブ分離
      case 'kei_truck':
        return `
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- bed -->
          <rect x="8" y="30" width="52" height="14" rx="3" fill="currentColor"/>
          <rect x="12" y="32" width="44" height="10" rx="2" fill="#fff" opacity="0.10"/>
          <!-- cabin -->
          <path fill="currentColor" d="
            M60 44
            V26
            C60 22 64 20 69 20
            H84
            C93 20 98 22 102 28
            L112 40
            V44
            C112 46 110 48 108 48
            H64
            C62 48 60 46 60 44
            Z"/>
          ${glass("M66 24 C66 22.5 67.5 22 69 22 H84 C89 22 93 24 96 28 L104 40 H66 Z")}
          ${wheel(28)}
          ${wheel(92)}
        </svg>`;

      // --- SUV (CX5) : 車高高め・タイヤ大きめ・窓2枚
      case 'suv':
        return `
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="
            M12 44
            V30
            C12 26 15 24 19 24
            H34
            L44 14
            C46 12 49 12 53 12
            H82
            C88 12 92 15 92 20
            V24
            H103
            C107 24 110 27 110 31
            V44
            C110 46 108 48 106 48
            H16
            C14 48 12 46 12 44
            Z"/>
          ${glass("M40 24 L46 17 C47 16 49 16 53 16 H67 V36 H40 Z")}
          <rect x="71" y="16" width="16" height="20" rx="3" fill="#fff" opacity="0.35"/>
          <!-- SUV wheels slightly bigger -->
          <circle cx="34" cy="48" r="11" fill="#fff"/>
          <circle cx="34" cy="48" r="6" fill="currentColor"/>
          <circle cx="88" cy="48" r="11" fill="#fff"/>
          <circle cx="88" cy="48" r="6" fill="currentColor"/>
        </svg>`;

      default:
        return svgIcon('sedan');
    }
  }

  // ---------------------------
  // View model: build per-vehicle AM/PM status
  // ---------------------------
  const SLOT_TIME = {
    AM: '08:00–13:00',
    PM: '13:00–18:00',
  };

  function buildVehicleDayView(vehicle){
    const vid = String(vehicle.vehicle_id);
    const rows = S.dayReservations.filter(r => String(r.vehicle_id) === vid);

    // default states
    const base = (slot) => ({
      slot,
      status: 'ok',
      badge: '空き',
      title: '予約できます',
      user: '',
      time: SLOT_TIME[slot],
      detail: '',
      reservation_id: '',
      dept_name: '',
      worker_name: '',
      date: S.dateISO,
      memo: '',
      start_date: '',
      end_date: '',
    });

    let am = base('AM');
    let pm = base('PM');

    // Helper: 予約時間の表示文字列を生成
    function getTimeDisplay(row, defaultTime) {
      if (row.start_time && row.end_time) {
        return `${row.start_time}–${row.end_time}`;
      }
      return defaultTime;
    }

    // FULL first - 終日予約がある場合
    const fullRow = rows.find(r => String(r.slot) === 'FULL');
    if (fullRow){
      const user = `${fullRow.dept_name}　${fullRow.worker_name}`;
      const fullState = {
        slot: 'FULL',
        status: 'ng',
        badge: '終日使用中',
        title: '終日使用の為、予約できません',
        user,
        time: getTimeDisplay(fullRow, '08:00–18:00'),
        start_time: fullRow.start_time || '',
        end_time: fullRow.end_time || '',
        detail: '',
        reservation_id: fullRow.reservation_id,
        dept_name: fullRow.dept_name,
        worker_name: fullRow.worker_name,
        date: fullRow.date || S.dateISO,
        memo: fullRow.memo || '',
        start_date: fullRow.start_date || fullRow.date || S.dateISO,
        end_date: fullRow.end_date || fullRow.date || S.dateISO,
      };
      return { am: null, pm: null, full: fullState };
    }

    // AM/PM
    const amRow = rows.find(r => String(r.slot) === 'AM');
    if (amRow){
      am = {
        ...am,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user: `${amRow.dept_name}　${amRow.worker_name}`,
        time: getTimeDisplay(amRow, SLOT_TIME['AM']),
        start_time: amRow.start_time || '',
        end_time: amRow.end_time || '',
        detail: '',
        reservation_id: amRow.reservation_id,
        dept_name: amRow.dept_name, worker_name: amRow.worker_name,
        date: amRow.date || S.dateISO,
        memo: amRow.memo || '',
        start_date: amRow.start_date || amRow.date || S.dateISO,
        end_date: amRow.end_date || amRow.date || S.dateISO,
      };
    }
    const pmRow = rows.find(r => String(r.slot) === 'PM');
    if (pmRow){
      pm = {
        ...pm,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user: `${pmRow.dept_name}　${pmRow.worker_name}`,
        time: getTimeDisplay(pmRow, SLOT_TIME['PM']),
        start_time: pmRow.start_time || '',
        end_time: pmRow.end_time || '',
        detail: '',
        reservation_id: pmRow.reservation_id,
        dept_name: pmRow.dept_name, worker_name: pmRow.worker_name,
        date: pmRow.date || S.dateISO,
        memo: pmRow.memo || '',
        start_date: pmRow.start_date || pmRow.date || S.dateISO,
        end_date: pmRow.end_date || pmRow.date || S.dateISO,
      };
    }

    return { am, pm, full: null };
  }

  // ---------------------------
  // Render
  // ---------------------------
  function renderAll(){
    $('dateTitleMain').textContent = formatTitle(S.dateISO);

    renderWeekTabs();
    renderVehicles();
  }

  function renderWeekTabs(){
    const host = $('weekTabs');
    host.innerHTML = '';

    const weekStart = startOfWeekISO(S.dateISO);
    for (let i=0;i<7;i++){
      const iso = addDaysISO(weekStart, i);
      const dt = isoToDate(iso);
      const m = dt.getMonth()+1;
      const d = dt.getDate();
      const dow = ['日','月','火','水','木','金','土'][dt.getDay()];

      const btn = document.createElement('button');
      btn.className = 'dayTab' + (iso === S.dateISO ? ' is-active' : '');
      btn.innerHTML = `
        <div class="dayTab__date">${m}/${d}</div>
        <div class="dayTab__dow">${dow}</div>
        <div class="dayTab__badge"></div>
      `;
      btn.addEventListener('click', () => setDateAndLoad(iso));
      host.appendChild(btn);
    }
  }

  function renderVehicles(){
    const ownedGrid = $('ownedGrid');
    const borrowGrid = $('borrowGrid');
    ownedGrid.innerHTML = '';
    borrowGrid.innerHTML = '';

    const vehicles = S.vehicles.slice();
    const owned = vehicles.filter(v => String(v.category) === 'owned');
    const borrow = vehicles.filter(v => String(v.category) === 'borrowable');

    owned.forEach(v => ownedGrid.appendChild(makeVehicleTile(v, false)));
    borrow.forEach(v => borrowGrid.appendChild(makeVehicleTile(v, true)));
  }

  // 車両ごとの注意メッセージ
  const VEHICLE_WARNINGS = {
    'カローラホワイト': '営業部鷲沢さんにご連絡下さい！',
    'カローラシルバー': '木下部長に必ず確認して下さい！',
    'CX5': 'TSC担当者に必ず確認して下さい！',
  };

  // 事前確認必要パネルのトグル
  $('borrowPanelHeader').addEventListener('click', () => {
    const panel = $('borrowPanel');
    panel.classList.toggle('is-collapsed');
  });

  function makeVehicleTile(vehicle, isSmall){
    const rawStyle = String(vehicle.ui_style || '') || inferStyleByName(vehicle.name);
    const style = normalizeStyle(rawStyle);
    const tag = styleTag(style);

    const { am, pm, full } = buildVehicleDayView(vehicle);

    const tile = document.createElement('article');
    tile.className = 'vehicleTile' + (isSmall ? ' vehicleTile--small' : '');
    tile.dataset.style = style;

    // 警告オーバーレイ（borrowableで警告がある車両のみ）
    const warningMsg = VEHICLE_WARNINGS[vehicle.name];
    const needsWarning = isSmall && warningMsg && !S.confirmedVehicles.has(vehicle.vehicle_id);
    const warningOverlayHtml = needsWarning ? `
      <div class="vehicleWarningOverlay" data-vehicle-id="${escapeHtml(vehicle.vehicle_id)}">
        <div class="vehicleWarningOverlay__icon">⚠️</div>
        <div class="vehicleWarningOverlay__text">${escapeHtml(warningMsg)}</div>
        <button class="vehicleWarningOverlay__btn" type="button">確認</button>
      </div>
    ` : '';

    // 終日予約がある場合は異なるレイアウト
    if (full) {
      // 日付付き時間表示を計算
      let fullTimeDisplay = full.time;
      if (full.start_date && full.end_date) {
        if (full.start_date === full.end_date) {
          fullTimeDisplay = `${formatDateShort(full.start_date)} ${full.time}`;
        } else {
          fullTimeDisplay = `${formatDateShort(full.start_date)}〜${formatDateShort(full.end_date)}`;
        }
      }

      tile.innerHTML = `
        ${warningOverlayHtml}
        <div class="vehicleTile__top">
          <div class="vehicleIcon" aria-hidden="true">${svgIcon(style)}</div>
          <div class="vehicleMeta">
            <div class="vehicleName">${escapeHtml(vehicle.name || '')}</div>
            <div class="vehicleTag">${escapeHtml(tag)}</div>
          </div>
        </div>

        <div class="slots">
          <button class="slotFull" data-slot="FULL">
            <div class="slotFull__badge">${escapeHtml(full.badge)}</div>
            <div class="slotFull__title">${escapeHtml(full.title)}</div>
            <div class="slotFull__user">${escapeHtml(full.user)}</div>
            <div class="slotFull__time">${escapeHtml(fullTimeDisplay)}</div>
            ${full.memo ? `<div class="slotFull__memo">📍 ${escapeHtml(full.memo)}</div>` : ''}
          </button>
        </div>
      `;

      // 警告オーバーレイの確認ボタン
      const warningOverlay = tile.querySelector('.vehicleWarningOverlay');
      if (warningOverlay) {
        const confirmBtn = warningOverlay.querySelector('.vehicleWarningOverlay__btn');
        confirmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          S.confirmedVehicles.add(vehicle.vehicle_id);
          warningOverlay.remove();
        });
      }

      const fullBtn = tile.querySelector('[data-slot="FULL"]');
      fullBtn.addEventListener('click', () => openDetailModal(vehicle, full));

      return tile;
    }

    // 通常のAM/PM表示
    tile.innerHTML = `
      ${warningOverlayHtml}
      <div class="vehicleTile__top">
        <div class="vehicleIcon" aria-hidden="true">${svgIcon(style)}</div>
        <div class="vehicleMeta">
          <div class="vehicleName">${escapeHtml(vehicle.name || '')}</div>
          <div class="vehicleTag">${escapeHtml(tag)}</div>
        </div>
      </div>

      <div class="slots">
        ${slotHtml(am)}
        ${slotHtml(pm)}
      </div>
    `;

    // 警告オーバーレイの確認ボタン
    const warningOverlay = tile.querySelector('.vehicleWarningOverlay');
    if (warningOverlay) {
      const confirmBtn = warningOverlay.querySelector('.vehicleWarningOverlay__btn');
      confirmBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        S.confirmedVehicles.add(vehicle.vehicle_id);
        warningOverlay.remove();
      });
    }

    // bind buttons
    const amBtn = tile.querySelector('[data-slot="AM"]');
    const pmBtn = tile.querySelector('[data-slot="PM"]');

    amBtn.addEventListener('click', () => onSlotClick(vehicle, am));
    pmBtn.addEventListener('click', () => onSlotClick(vehicle, pm));

    return tile;
  }

  function slotHtml(s){
    const cls = s.status === 'ng' ? 'slot slot--ng' : 'slot slot--ok';
    const userLine = s.user ? `<div class="slot__user">${escapeHtml(s.user)}</div>` : '';
    const detailLine = s.detail ? `<div class="slot__detail">${escapeHtml(s.detail)}</div>` : '';
    const memoLine = s.memo ? `<div class="slot__memo">📍 ${escapeHtml(s.memo)}</div>` : '';

    // 予約ありの場合は日付付きで表示
    let timeDisplay = s.time;
    if (s.status === 'ng' && s.start_date && s.end_date) {
      if (s.start_date === s.end_date) {
        // 同日
        timeDisplay = `${formatDateShort(s.start_date)} ${s.time}`;
      } else {
        // 複数日
        timeDisplay = `${formatDateShort(s.start_date)}〜${formatDateShort(s.end_date)}`;
      }
    }

    return `
      <button class="${cls}" data-slot="${s.slot}">
        <div class="slot__head">
          <div class="slot__label">${s.slot}</div>
          <div class="slot__badge">${escapeHtml(s.badge)}</div>
        </div>
        <div class="slot__title">${escapeHtml(s.title)}</div>
        ${userLine}
        <div class="slot__time">${escapeHtml(timeDisplay)}</div>
        ${detailLine}
        ${memoLine}
      </button>
    `;
  }

  // ---------------------------
  // Slot click
  // ---------------------------
  function onSlotClick(vehicle, slotState){
    if (slotState.status === 'ok'){
      openCreateModal(vehicle, slotState.slot);
    } else {
      openDetailModal(vehicle, slotState);
    }
  }

  // ---------------------------
  // Create reservation modal
  // ---------------------------
  function openCreateModal(vehicle, slot){
    const deptOptions = S.deptList.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

    const bodyHtml = `
      <div class="form" id="createForm">
        <div class="field">
          <label>車両</label>
          <div class="input" style="background:#f5f6f8;">${escapeHtml(vehicle.name)}</div>
        </div>
        <div class="field fullRow">
          <label>時間帯</label>
          <div class="chipRow" id="slotChips">
            <button type="button" class="chip${slot === 'AM' ? ' is-active' : ''}" data-slot="AM">AM (08:00-13:00)</button>
            <button type="button" class="chip${slot === 'PM' ? ' is-active' : ''}" data-slot="PM">PM (13:00-18:00)</button>
            <button type="button" class="chip${slot === 'FULL' ? ' is-active' : ''}" data-slot="FULL">終日</button>
          </div>
          <div class="timeline" id="timeline">
            <div class="timeline__header">
              <span class="timeline__hint">ドラッグで時間を選択</span>
              <span class="timeline__display" id="timeDisplay">08:00 - 18:00</span>
            </div>
            <div class="timeline__labels" id="timelineLabels"></div>
            <div class="timeline__bar" id="timelineBar"></div>
          </div>
        </div>
        <div class="field">
          <label>開始日</label>
          <input type="date" class="input" id="startDate" value="${S.dateISO}">
        </div>
        <div class="field">
          <label>終了日</label>
          <input type="date" class="input" id="endDate" value="${S.dateISO}">
        </div>
        <div class="field">
          <label>部署 <span style="color:#c00;">*</span></label>
          <select class="input" id="deptSelect">
            <option value="">選択してください</option>
            ${deptOptions}
          </select>
        </div>
        <div class="field">
          <label>氏名 <span style="color:#c00;">*</span></label>
          <select class="input" id="workerSelect" disabled>
            <option value="">部署を選択してください</option>
          </select>
        </div>
        <div class="field fullRow">
          <label>メモ（任意）</label>
          <input type="text" class="input" id="memoInput" placeholder="例：客先訪問">
        </div>
        <div id="conflictArea" class="fullRow" style="display:none;"></div>
      </div>
    `;

    const footHtml = `
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn btn--primary" id="submitBtn">予約する</button>
    `;

    openModal(`予約作成：${vehicle.name}`, bodyHtml, footHtml);

    // State for this modal
    let selectedSlot = slot;
    let selectedWorker = null;
    let selectedStartTime = slot === 'AM' ? '08:00' : (slot === 'PM' ? '13:00' : '08:00');
    let selectedEndTime = slot === 'AM' ? '13:00' : (slot === 'PM' ? '18:00' : '18:00');

    // Timeline setup - 30分刻み、08:00-18:00
    const TIMELINE_START = 8; // 08:00
    const TIMELINE_END = 18;  // 18:00
    const INTERVAL = 30;      // 30分
    const CELLS = (TIMELINE_END - TIMELINE_START) * (60 / INTERVAL); // 20 cells

    function timeToIndex(time) {
      const [hh, mm] = time.split(':').map(Number);
      return ((hh - TIMELINE_START) * 60 + mm) / INTERVAL;
    }

    function indexToTime(idx) {
      const totalMin = TIMELINE_START * 60 + idx * INTERVAL;
      const hh = Math.floor(totalMin / 60);
      const mm = totalMin % 60;
      return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }

    function updateTimeDisplay() {
      const display = $('timeDisplay');
      if (display) display.textContent = `${selectedStartTime} - ${selectedEndTime}`;
    }

    function updateTimelineSelection() {
      const startIdx = timeToIndex(selectedStartTime);
      const endIdx = timeToIndex(selectedEndTime);
      const cells = document.querySelectorAll('#timelineBar .timeline__cell');
      cells.forEach((cell, i) => {
        const isSelected = i >= startIdx && i < endIdx;
        cell.classList.toggle('is-selected', isSelected);
        cell.classList.toggle('is-start', i === startIdx);
        cell.classList.toggle('is-end', i === endIdx - 1);
      });
      updateTimeDisplay();
    }

    function determineSlotFromTime(startTime, endTime) {
      // 時間を分に変換
      const [startH, startM] = startTime.split(':').map(Number);
      const [endH, endM] = endTime.split(':').map(Number);
      const startMin = startH * 60 + startM;
      const endMin = endH * 60 + endM;
      const boundary = 13 * 60; // 13:00 = AM/PM境界

      // AM/PM境界をまたぐ場合はFULL
      if (startMin < boundary && endMin > boundary) return 'FULL';
      // 完全にAM時間帯内（08:00-13:00）
      if (endMin <= boundary) return 'AM';
      // 完全にPM時間帯内（13:00-18:00）
      return 'PM';
    }

    function syncChipsWithTime() {
      const newSlot = determineSlotFromTime(selectedStartTime, selectedEndTime);
      const slotChips = document.querySelectorAll('#slotChips .chip');
      slotChips.forEach(c => c.classList.remove('is-active'));
      const matchingChip = document.querySelector(`#slotChips .chip[data-slot="${newSlot}"]`);
      if (matchingChip) matchingChip.classList.add('is-active');
      selectedSlot = newSlot;
    }

    // Build timeline labels (hourly)
    const labelsEl = $('timelineLabels');
    for (let h = TIMELINE_START; h <= TIMELINE_END; h++) {
      const label = document.createElement('span');
      label.className = 'timeline__label';
      label.textContent = h < TIMELINE_END ? String(h).padStart(2, '0') : '';
      label.style.flex = h < TIMELINE_END ? '2' : '0';
      labelsEl.appendChild(label);
    }

    // Build timeline cells
    const barEl = $('timelineBar');
    for (let i = 0; i < CELLS; i++) {
      const cell = document.createElement('div');
      cell.className = 'timeline__cell';
      cell.dataset.index = i;
      // 1時間ごとの区切り線
      if ((i + 1) % 2 === 0 && i < CELLS - 1) {
        cell.classList.add('is-hour');
      }
      barEl.appendChild(cell);
    }

    // Initialize timeline selection
    updateTimelineSelection();

    // Timeline drag logic
    let isDragging = false;
    let dragStart = null;

    function handleDragStart(e) {
      const cell = e.target.closest('.timeline__cell');
      if (!cell) return;
      isDragging = true;
      dragStart = parseInt(cell.dataset.index, 10);
      e.preventDefault();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      const bar = $('timelineBar');
      const rect = bar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const relX = clientX - rect.left;
      const cellWidth = rect.width / CELLS;
      let idx = Math.floor(relX / cellWidth);
      idx = Math.max(0, Math.min(CELLS - 1, idx));

      const minIdx = Math.min(dragStart, idx);
      const maxIdx = Math.max(dragStart, idx);
      selectedStartTime = indexToTime(minIdx);
      selectedEndTime = indexToTime(maxIdx + 1);
      updateTimelineSelection();
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      dragStart = null;
      syncChipsWithTime();
    }

    barEl.addEventListener('mousedown', handleDragStart);
    barEl.addEventListener('touchstart', handleDragStart, { passive: false });
    document.addEventListener('mousemove', handleDragMove);
    document.addEventListener('touchmove', handleDragMove, { passive: false });
    document.addEventListener('mouseup', handleDragEnd);
    document.addEventListener('touchend', handleDragEnd);

    // Cleanup function for event listeners
    function cleanupTimelineListeners() {
      document.removeEventListener('mousemove', handleDragMove);
      document.removeEventListener('touchmove', handleDragMove);
      document.removeEventListener('mouseup', handleDragEnd);
      document.removeEventListener('touchend', handleDragEnd);
    }

    // Slot chip toggle - also updates timeline
    const slotChips = document.querySelectorAll('#slotChips .chip');
    slotChips.forEach(chip => {
      chip.addEventListener('click', () => {
        slotChips.forEach(c => c.classList.remove('is-active'));
        chip.classList.add('is-active');
        selectedSlot = chip.dataset.slot;
        // Update time based on slot
        if (selectedSlot === 'AM') {
          selectedStartTime = '08:00';
          selectedEndTime = '13:00';
        } else if (selectedSlot === 'PM') {
          selectedStartTime = '13:00';
          selectedEndTime = '18:00';
        } else {
          selectedStartTime = '08:00';
          selectedEndTime = '18:00';
        }
        updateTimelineSelection();
      });
    });

    // Dept -> Worker loading
    const deptSelect = $('deptSelect');
    const workerSelect = $('workerSelect');

    deptSelect.addEventListener('change', async () => {
      const dept = deptSelect.value;
      workerSelect.innerHTML = '<option value="">読み込み中...</option>';
      workerSelect.disabled = true;
      selectedWorker = null;

      if (!dept) {
        workerSelect.innerHTML = '<option value="">部署を選択してください</option>';
        return;
      }

      try {
        const workers = await apiGetWorkersByDept(dept);
        if (workers.length === 0) {
          workerSelect.innerHTML = '<option value="">作業員が見つかりません</option>';
        } else {
          workerSelect.innerHTML = '<option value="">選択してください</option>' +
            workers.map(w => `<option value="${escapeHtml(w.worker_code)}" data-name="${escapeHtml(w.worker_name)}">${escapeHtml(w.worker_name)}</option>`).join('');
          workerSelect.disabled = false;
        }
      } catch (e) {
        workerSelect.innerHTML = '<option value="">エラーが発生しました</option>';
        toast('エラー', e.message || '作業員取得に失敗');
      }
    });

    workerSelect.addEventListener('change', () => {
      const opt = workerSelect.selectedOptions[0];
      if (opt && opt.value) {
        selectedWorker = {
          worker_code: opt.value,
          worker_name: opt.dataset.name || '',
        };
      } else {
        selectedWorker = null;
      }
    });

    // Cancel
    $('cancelBtn').addEventListener('click', () => {
      cleanupTimelineListeners();
      closeModal();
    });

    // Submit - 楽観的UI更新（即座にUI反映、バックグラウンド保存）
    $('submitBtn').addEventListener('click', async () => {
      const startDate = $('startDate').value;
      const endDate = $('endDate').value;
      const dept = deptSelect.value;

      // Validation
      if (!dept) {
        toast('入力エラー', '部署を選択してください');
        return;
      }
      if (!selectedWorker) {
        toast('入力エラー', '氏名を選択してください');
        return;
      }
      if (!startDate || !endDate) {
        toast('入力エラー', '日付を入力してください');
        return;
      }
      if (startDate > endDate) {
        toast('入力エラー', '終了日は開始日以降にしてください');
        return;
      }

      const payload = {
        vehicle_id: vehicle.vehicle_id,
        start_date: startDate,
        end_date: endDate,
        slot: selectedSlot,
        start_time: selectedStartTime,
        end_time: selectedEndTime,
        dept_name: dept,
        worker_code: selectedWorker.worker_code,
        worker_name: selectedWorker.worker_name,
        memo: $('memoInput').value || '',
        source_system: 'webapp',
        source_id: '',
      };

      // 楽観的更新: 即座にUIに反映
      const tempId = 'TEMP_' + Date.now();
      const optimisticReservation = {
        reservation_id: tempId,
        vehicle_id: vehicle.vehicle_id,
        date: S.dateISO,
        slot: selectedSlot,
        start_time: selectedStartTime,
        end_time: selectedEndTime,
        dept_name: dept,
        worker_name: selectedWorker.worker_name,
        worker_code: selectedWorker.worker_code,
      };

      // 当日の場合のみ即座にUI更新
      if (startDate <= S.dateISO && endDate >= S.dateISO) {
        S.dayReservations.push(optimisticReservation);
        renderVehicles();
      }

      // モーダルを即座に閉じる
      cleanupTimelineListeners();
      closeModal();
      toast('予約中...', `${vehicle.name}`);
      setSaveState('saving');

      // バックグラウンドで保存
      try {
        const res = await apiCreateReservation(payload);
        if (res.ok) {
          // 成功: 仮IDを実際のIDに置換（次回リロード時に反映）
          toast('予約完了', `${vehicle.name} を予約しました`);
          // サーバーから最新データを取得して同期
          await reloadDay();
        } else if (res.code === 'CONFLICT') {
          // 競合: 楽観的更新をロールバック
          S.dayReservations = S.dayReservations.filter(r => r.reservation_id !== tempId);
          renderVehicles();
          const conflicts = res.conflicts || [];
          toast('競合エラー', `${conflicts.map(c => `${c.existing_dept} ${c.existing_name}`).join(', ')} が既に予約済み`);
        } else {
          // エラー: ロールバック
          S.dayReservations = S.dayReservations.filter(r => r.reservation_id !== tempId);
          renderVehicles();
          toast('エラー', res.message || '予約に失敗しました');
        }
      } catch (e) {
        // エラー: ロールバック
        S.dayReservations = S.dayReservations.filter(r => r.reservation_id !== tempId);
        renderVehicles();
        toast('エラー', e.message || '予約に失敗しました');
      } finally {
        setSaveState('saved');
      }
    });
  }

  // ---------------------------
  // Detail / Cancel modal
  // ---------------------------
  // 日付フォーマット用ヘルパー
  function formatDateJP(iso){
    const dt = isoToDate(iso);
    return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
  }
  function formatDateShort(iso){
    const dt = isoToDate(iso);
    return `${dt.getMonth()+1}/${dt.getDate()}`;
  }

  function openDetailModal(vehicle, slotState){
    // 使用期間を計算（開始日〜終了日）
    const startDateStr = slotState.start_date || slotState.date || S.dateISO;
    const endDateStr = slotState.end_date || slotState.date || S.dateISO;

    // 実際の予約時間を使用（なければスロットのデフォルト時間）
    let startTime = slotState.start_time || '';
    let endTime = slotState.end_time || '';
    if (!startTime || !endTime) {
      if (slotState.slot === 'AM') { startTime = '08:00'; endTime = '13:00'; }
      else if (slotState.slot === 'PM') { startTime = '13:00'; endTime = '18:00'; }
      else if (slotState.slot === 'FULL') { startTime = '08:00'; endTime = '18:00'; }
    }

    // 同日か複数日かで表示を変える
    let usagePeriod = '';
    if (startDateStr === endDateStr) {
      usagePeriod = `${formatDateJP(startDateStr)} ${startTime}〜${endTime}`;
    } else {
      usagePeriod = `${formatDateJP(startDateStr)} ${startTime} 〜 ${formatDateJP(endDateStr)} ${endTime}`;
    }

    const bodyHtml = `
      <div class="detailRow">
        <div class="detailLabel">車両</div>
        <div class="detailValue">${escapeHtml(vehicle.name)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">スロット</div>
        <div class="detailValue">${escapeHtml(slotState.slot)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">使用期間</div>
        <div class="detailValue">${escapeHtml(usagePeriod)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">部署</div>
        <div class="detailValue">${escapeHtml(slotState.dept_name)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">氏名</div>
        <div class="detailValue">${escapeHtml(slotState.worker_name)}</div>
      </div>
      ${slotState.memo ? `
      <div class="detailRow">
        <div class="detailLabel">メモ</div>
        <div class="detailValue">${escapeHtml(slotState.memo)}</div>
      </div>
      ` : ''}
      <div class="detailRow" style="border:none; padding-top: 16px;">
        <div class="note">この予約を取り消す場合は「予約取消」を押してください。</div>
      </div>
    `;

    const footHtml = `
      <button class="btn" id="closeDetailBtn">閉じる</button>
      <button class="btn btn--danger" id="cancelReservationBtn">予約取消</button>
    `;

    openModal(`予約詳細：${vehicle.name}`, bodyHtml, footHtml);

    $('closeDetailBtn').addEventListener('click', closeModal);

    // 楽観的UI更新で即座に取消を反映
    $('cancelReservationBtn').addEventListener('click', async () => {
      if (!confirm('この予約を取り消しますか？')) return;

      const reservationId = slotState.reservation_id;

      // 楽観的更新: 即座にUIから削除
      const backup = [...S.dayReservations];
      S.dayReservations = S.dayReservations.filter(r => r.reservation_id !== reservationId);

      // モーダルを即座に閉じてUI更新
      closeModal();
      renderVehicles();
      toast('取消中...', '');
      setSaveState('saving');

      // バックグラウンドで削除
      try {
        const res = await apiCancelReservation(reservationId);
        if (res.ok) {
          toast('取消完了', '予約を取り消しました');
          // サーバーと同期
          await reloadDay();
        } else {
          // エラー: ロールバック
          S.dayReservations = backup;
          renderVehicles();
          toast('エラー', res.message || '取消に失敗しました');
        }
      } catch (e) {
        // エラー: ロールバック
        S.dayReservations = backup;
        renderVehicles();
        toast('エラー', e.message || '取消に失敗しました');
      } finally {
        setSaveState('saved');
      }
    });
  }

  // ---------------------------
  // API wrappers (google.script.run -> Promise)
  // ---------------------------
  function runGAS(fn, ...args){
    console.log('runGAS calling:', fn, args);
    return new Promise((resolve, reject) => {
      if (!google || !google.script || !google.script.run) {
        console.error('google.script.run is not available');
        reject(new Error('google.script.run is not available'));
        return;
      }
      const runner = google.script.run;
      if (typeof runner[fn] !== 'function') {
        console.error('Function not found:', fn);
        reject(new Error('Function not found: ' + fn));
        return;
      }
      runner
        .withSuccessHandler((result) => {
          console.log('runGAS success:', fn, result);
          resolve(result);
        })
        .withFailureHandler((error) => {
          console.error('runGAS failure:', fn, error);
          reject(error);
        })[fn](...args);
    });
  }

  async function apiInit(dateISO){
    const res = await runGAS('getInit', dateISO);
    return res;
  }
  async function apiGetDay(dateISO){
    const res = await runGAS('getDay', dateISO);
    return res;
  }
  async function apiGetWorkersByDept(dept){
    if (S.workersCache.has(dept)) return S.workersCache.get(dept);
    const res = await runGAS('getWorkersByDept', dept);
    if (!res.ok) throw new Error(res.message || 'getWorkersByDept failed');
    const workers = res.data.workers || [];
    S.workersCache.set(dept, workers);
    return workers;
  }
  async function apiCreateReservation(payload){
    const res = await runGAS('createReservation', payload);
    return res;
  }
  async function apiCancelReservation(reservationId){
    const res = await runGAS('cancelReservation', reservationId);
    return res;
  }

  // ---------------------------
  // Load / Reload
  // ---------------------------
  async function setDateAndLoad(iso){
    S.dateISO = iso;
    $('dateTitleMain').textContent = formatTitle(S.dateISO);
    renderWeekTabs();
    await reloadDay();
  }

  async function reloadDay(){
    setSaveState('saving');
    try{
      const res = await apiGetDay(S.dateISO);
      if (!res || !res.ok){
        toast('エラー', res?.message || '当日データ取得に失敗');
        console.error('reloadDay failed:', res);
        return;
      }
      S.dayReservations = res.data.dayReservations || [];
      renderVehicles();
    } finally {
      setSaveState('saved');
    }
  }

  // ---------------------------
  // Nav buttons
  // ---------------------------
  $('btnPrev').addEventListener('click', () => setDateAndLoad(addDaysISO(S.dateISO, -1)));
  $('btnNext').addEventListener('click', () => setDateAndLoad(addDaysISO(S.dateISO,  1)));
  $('btnToday').addEventListener('click', () => {
    const todayISO = dateToISO(new Date());
    setDateAndLoad(todayISO);
  });

  // ---------------------------
  // Boot
  // ---------------------------
  async function boot(){
    setSaveState('saving');
    try{
      const todayISO = dateToISO(new Date());
      const res = await apiInit(todayISO);
      if (!res || !res.ok){
        toast('エラー', res?.message || '初期化に失敗しました。ページを再読み込みしてください。');
        console.error('boot failed:', res);
        return;
      }
      const data = res.data;
      S.dateISO = data.date;
      S.vehicles = data.vehicles || [];
      S.dayReservations = data.dayReservations || [];
      S.deptList = (data.deptList || []).filter(Boolean);
      $('dateTitleMain').textContent = formatTitle(S.dateISO);

      renderAll();
      toast('準備完了', '当日の予約状況を表示しました');
    } catch(e){
      toast('エラー', String(e?.message || e));
      console.error('boot error:', e);
    } finally {
      setSaveState('saved');
    }
  }

  boot();
})();
</script>
