<!-- UiJs.html -->
<script>
(() => {
  // ---------------------------
  // State
  // ---------------------------
  const S = {
    dateISO: null,
    vehicles: [],
    dayReservations: [],
    deptList: [],
    workersCache: new Map(), // dept -> workers[]
  };

  // ---------------------------
  // Helpers (date)
  // ---------------------------
  const pad2 = (n) => String(n).padStart(2, '0');

  function isoToDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function dateToISO(dt){
    return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
  }
  function formatTitle(iso){
    const dt = isoToDate(iso);
    const y = dt.getFullYear();
    const m = dt.getMonth()+1;
    const d = dt.getDate();
    const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
    return `${y}-${pad2(m)}-${pad2(d)}（${dow}）`;
  }
  function startOfWeekISO(iso){
    // Monday-start week for UI (can adjust later)
    const dt = isoToDate(iso);
    const day = dt.getDay(); // 0 Sun ... 6 Sat
    const delta = (day === 0 ? -6 : 1 - day); // move to Monday
    dt.setDate(dt.getDate() + delta);
    return dateToISO(dt);
  }
  function addDaysISO(iso, n){
    const dt = isoToDate(iso);
    dt.setDate(dt.getDate() + n);
    return dateToISO(dt);
  }

  // ---------------------------
  // Helpers (toast / modal / save state)
  // ---------------------------
  const $ = (id) => document.getElementById(id);

  function setSaveState(mode){
    const el = $('saveState');
    if (mode === 'saving'){
      el.textContent = '保存中…';
      el.classList.remove('is-saved');
      el.classList.add('is-saving');
    } else {
      el.textContent = '保存済み';
      el.classList.remove('is-saving');
      el.classList.add('is-saved');
    }
  }

  function toast(title, msg){
    const host = $('toastHost');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<div class="toast__title">${escapeHtml(title)}</div>
                   <div class="toast__msg">${escapeHtml(msg || '')}</div>`;
    host.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(4px)';
      t.style.transition = 'opacity .18s ease, transform .18s ease';
    }, 2600);
    setTimeout(() => t.remove(), 3200);
  }

  function openModal(title, bodyHtml, footHtml){
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = bodyHtml;
    $('modalFoot').innerHTML = footHtml || '';
    $('modalOverlay').classList.remove('is-hidden');
  }
  function closeModal(){
    $('modalOverlay').classList.add('is-hidden');
    $('modalBody').innerHTML = '';
    $('modalFoot').innerHTML = '';
  }

  $('modalClose').addEventListener('click', closeModal);
  $('modalOverlay').addEventListener('click', (e) => {
    if (e.target === $('modalOverlay')) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function escapeHtml(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;');
  }

  // ---------------------------
  // SVG icons (5 styles)
  // ---------------------------
  // スタイル名の正規化（van -> van_box など）
  function normalizeStyle(style){
    const s = String(style || '').toLowerCase();
    if (s === 'van') return 'van_box';
    return s;
  }

  function svgIcon(rawStyle){
    const style = normalizeStyle(rawStyle);
    // 塗りつぶしシルエットスタイル（白は#fff固定）
    switch(style){
      case 'sedan':
        return `
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M20 70 L20 55 Q20 50 25 50 L45 50 L60 30 Q65 25 75 25 L125 25 Q135 25 140 30 L155 50 L175 50 Q180 50 180 55 L180 70 Q180 75 175 75 L25 75 Q20 75 20 70 Z"/>
          <circle cx="50" cy="75" r="15" fill="#fff"/>
          <circle cx="50" cy="75" r="6" fill="currentColor"/>
          <circle cx="150" cy="75" r="15" fill="#fff"/>
          <circle cx="150" cy="75" r="6" fill="currentColor"/>
          <path fill="#fff" opacity="0.4" d="M65 30 L75 48 L125 48 L135 30 Q130 27 125 27 L75 27 Q70 27 65 30 Z"/>
        </svg>`;
      case 'van_box':
        return `
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M15 70 L15 32 Q15 22 25 22 L140 22 Q158 22 165 35 L185 58 L185 70 Q185 75 180 75 L20 75 Q15 75 15 70 Z"/>
          <circle cx="45" cy="75" r="15" fill="#fff"/>
          <circle cx="45" cy="75" r="6" fill="currentColor"/>
          <circle cx="155" cy="75" r="15" fill="#fff"/>
          <circle cx="155" cy="75" r="6" fill="currentColor"/>
          <rect x="22" y="28" width="28" height="28" rx="3" fill="#fff" opacity="0.4"/>
          <rect x="55" y="28" width="28" height="28" rx="3" fill="#fff" opacity="0.4"/>
          <path fill="#fff" opacity="0.4" d="M148 30 L172 58 L148 58 Z"/>
        </svg>`;
      case 'minivan':
        return `
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M18 70 L18 38 Q18 22 35 22 L145 22 Q168 22 175 40 L188 60 L188 70 Q188 75 183 75 L23 75 Q18 75 18 70 Z"/>
          <circle cx="48" cy="75" r="15" fill="#fff"/>
          <circle cx="48" cy="75" r="6" fill="currentColor"/>
          <circle cx="152" cy="75" r="15" fill="#fff"/>
          <circle cx="152" cy="75" r="6" fill="currentColor"/>
          <rect x="28" y="28" width="24" height="30" rx="3" fill="#fff" opacity="0.4"/>
          <rect x="57" y="28" width="24" height="30" rx="3" fill="#fff" opacity="0.4"/>
          <rect x="86" y="28" width="24" height="30" rx="3" fill="#fff" opacity="0.4"/>
          <path fill="#fff" opacity="0.4" d="M152 28 L175 58 L152 58 Z"/>
        </svg>`;
      case 'kei_truck':
        return `
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M12 48 L12 70 Q12 75 17 75 L90 75 L90 48 Q90 43 85 43 L17 43 Q12 43 12 48 Z"/>
          <path fill="#fff" opacity="0.15" d="M16 50 L86 50 L86 72 L16 72 Z"/>
          <path fill="currentColor" d="M90 70 L90 38 Q90 28 100 28 L138 28 Q158 28 168 42 L188 62 L188 70 Q188 75 183 75 L90 75 Z"/>
          <circle cx="42" cy="75" r="15" fill="#fff"/>
          <circle cx="42" cy="75" r="6" fill="currentColor"/>
          <circle cx="158" cy="75" r="15" fill="#fff"/>
          <circle cx="158" cy="75" r="6" fill="currentColor"/>
          <path fill="#fff" opacity="0.4" d="M96 33 L96 60 L158 60 L148 42 Q142 33 132 33 Z"/>
        </svg>`;
      case 'suv':
        return `
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M12 72 L12 52 Q12 47 17 47 L38 47 L55 24 Q60 18 72 18 L128 18 Q140 18 145 24 L162 47 L183 47 Q188 47 188 52 L188 72 Q188 78 183 78 L17 78 Q12 78 12 72 Z"/>
          <circle cx="48" cy="78" r="18" fill="#fff"/>
          <circle cx="48" cy="78" r="8" fill="currentColor"/>
          <circle cx="152" cy="78" r="18" fill="#fff"/>
          <circle cx="152" cy="78" r="8" fill="currentColor"/>
          <path fill="#fff" opacity="0.4" d="M60 24 L72 47 L128 47 L140 24 Q135 20 128 20 L72 20 Q65 20 60 24 Z"/>
        </svg>`;
      default:
        return svgIcon('sedan');
    }
  }

  function styleTag(rawStyle){
    const style = normalizeStyle(rawStyle);
    const map = {
      sedan: 'SEDAN',
      minivan: 'MINIVAN',
      van_box: 'VAN',
      kei_truck: 'KEI TRUCK',
      suv: 'SUV',
    };
    return map[style] || 'VEHICLE';
  }

  function inferStyleByName(name){
    const n = String(name || '');
    if (n.includes('軽トラ')) return 'kei_truck';
    if (n.includes('ハイエース')) return 'van_box';
    if (n.includes('ノア')) return 'minivan';
    if (n.includes('CX')) return 'suv';
    if (n.includes('カローラ')) return 'sedan';
    return 'sedan';
  }

  // ---------------------------
  // View model: build per-vehicle AM/PM status
  // ---------------------------
  const SLOT_TIME = {
    AM: '08:00–13:00',
    PM: '13:00–18:00',
  };

  function buildVehicleDayView(vehicle){
    const vid = String(vehicle.vehicle_id);
    const rows = S.dayReservations.filter(r => String(r.vehicle_id) === vid);

    // default states
    const base = (slot) => ({
      slot,
      status: 'ok',
      badge: '空き',
      title: '予約できます',
      user: '',
      time: SLOT_TIME[slot],
      detail: '',
      reservation_id: '',
      dept_name: '',
      worker_name: '',
    });

    let am = base('AM');
    let pm = base('PM');

    // FULL first
    const full = rows.find(r => String(r.slot) === 'FULL');
    if (full){
      const user = `${full.dept_name}　${full.worker_name}`;
      const detail = (full.start_time && full.end_time) ? `※ ${full.start_time}–${full.end_time}` : '';
      am = {
        ...am,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user, detail, reservation_id: full.reservation_id,
        dept_name: full.dept_name, worker_name: full.worker_name,
      };
      pm = {
        ...pm,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user, detail, reservation_id: full.reservation_id,
        dept_name: full.dept_name, worker_name: full.worker_name,
      };
      return { am, pm };
    }

    // AM/PM
    const amRow = rows.find(r => String(r.slot) === 'AM');
    if (amRow){
      am = {
        ...am,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user: `${amRow.dept_name}　${amRow.worker_name}`,
        detail: (amRow.start_time && amRow.end_time) ? `※ ${amRow.start_time}–${amRow.end_time}` : '',
        reservation_id: amRow.reservation_id,
        dept_name: amRow.dept_name, worker_name: amRow.worker_name,
      };
    }
    const pmRow = rows.find(r => String(r.slot) === 'PM');
    if (pmRow){
      pm = {
        ...pm,
        status:'ng', badge:'使用中', title:'使えません（予約あり）',
        user: `${pmRow.dept_name}　${pmRow.worker_name}`,
        detail: (pmRow.start_time && pmRow.end_time) ? `※ ${pmRow.start_time}–${pmRow.end_time}` : '',
        reservation_id: pmRow.reservation_id,
        dept_name: pmRow.dept_name, worker_name: pmRow.worker_name,
      };
    }

    return { am, pm };
  }

  // ---------------------------
  // Render
  // ---------------------------
  function renderAll(){
    $('dateTitleMain').textContent = formatTitle(S.dateISO);

    renderWeekTabs();
    renderVehicles();
  }

  function renderWeekTabs(){
    const host = $('weekTabs');
    host.innerHTML = '';

    const weekStart = startOfWeekISO(S.dateISO);
    for (let i=0;i<7;i++){
      const iso = addDaysISO(weekStart, i);
      const dt = isoToDate(iso);
      const m = dt.getMonth()+1;
      const d = dt.getDate();
      const dow = ['日','月','火','水','木','金','土'][dt.getDay()];

      const btn = document.createElement('button');
      btn.className = 'dayTab' + (iso === S.dateISO ? ' is-active' : '');
      btn.innerHTML = `
        <div class="dayTab__date">${m}/${d}</div>
        <div class="dayTab__dow">${dow}</div>
        <div class="dayTab__badge"></div>
      `;
      btn.addEventListener('click', () => setDateAndLoad(iso));
      host.appendChild(btn);
    }
  }

  function renderVehicles(){
    const ownedGrid = $('ownedGrid');
    const borrowGrid = $('borrowGrid');
    ownedGrid.innerHTML = '';
    borrowGrid.innerHTML = '';

    const vehicles = S.vehicles.slice();
    const owned = vehicles.filter(v => String(v.category) === 'owned');
    const borrow = vehicles.filter(v => String(v.category) === 'borrowable');

    owned.forEach(v => ownedGrid.appendChild(makeVehicleTile(v, false)));
    borrow.forEach(v => borrowGrid.appendChild(makeVehicleTile(v, true)));
  }

  function makeVehicleTile(vehicle, isSmall){
    const rawStyle = String(vehicle.ui_style || '') || inferStyleByName(vehicle.name);
    const style = normalizeStyle(rawStyle);
    const tag = styleTag(style);

    const { am, pm } = buildVehicleDayView(vehicle);

    const tile = document.createElement('article');
    tile.className = 'vehicleTile' + (isSmall ? ' vehicleTile--small' : '');
    tile.dataset.style = style;

    tile.innerHTML = `
      <div class="vehicleTile__top">
        <div class="vehicleIcon" aria-hidden="true">${svgIcon(style)}</div>
        <div class="vehicleMeta">
          <div class="vehicleName">${escapeHtml(vehicle.name || '')}</div>
          <div class="vehicleTag">${escapeHtml(tag)}</div>
        </div>
      </div>

      <div class="slots">
        ${slotHtml(am)}
        ${slotHtml(pm)}
      </div>
    `;

    // bind buttons
    const amBtn = tile.querySelector('[data-slot="AM"]');
    const pmBtn = tile.querySelector('[data-slot="PM"]');

    amBtn.addEventListener('click', () => onSlotClick(vehicle, am));
    pmBtn.addEventListener('click', () => onSlotClick(vehicle, pm));

    return tile;
  }

  function slotHtml(s){
    const cls = s.status === 'ng' ? 'slot slot--ng' : 'slot slot--ok';
    const userLine = s.user ? `<div class="slot__user">${escapeHtml(s.user)}</div>` : '';
    const detailLine = s.detail ? `<div class="slot__detail">${escapeHtml(s.detail)}</div>` : '';
    return `
      <button class="${cls}" data-slot="${s.slot}">
        <div class="slot__head">
          <div class="slot__label">${s.slot}</div>
          <div class="slot__badge">${escapeHtml(s.badge)}</div>
        </div>
        <div class="slot__title">${escapeHtml(s.title)}</div>
        ${userLine}
        <div class="slot__time">${escapeHtml(s.time)}</div>
        ${detailLine}
      </button>
    `;
  }

  // ---------------------------
  // Slot click
  // ---------------------------
  function onSlotClick(vehicle, slotState){
    if (slotState.status === 'ok'){
      openCreateModal(vehicle, slotState.slot);
    } else {
      openDetailModal(vehicle, slotState);
    }
  }

  // ---------------------------
  // Create reservation modal
  // ---------------------------
  function openCreateModal(vehicle, slot){
    const deptOptions = S.deptList.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');

    const bodyHtml = `
      <div class="form" id="createForm">
        <div class="field">
          <label>車両</label>
          <div class="input" style="background:#f5f6f8;">${escapeHtml(vehicle.name)}</div>
        </div>
        <div class="field">
          <label>スロット</label>
          <div class="chipRow" id="slotChips">
            <button type="button" class="chip${slot === 'AM' ? ' is-active' : ''}" data-slot="AM">AM</button>
            <button type="button" class="chip${slot === 'PM' ? ' is-active' : ''}" data-slot="PM">PM</button>
            <button type="button" class="chip${slot === 'FULL' ? ' is-active' : ''}" data-slot="FULL">終日</button>
          </div>
        </div>
        <div class="field">
          <label>開始日</label>
          <input type="date" class="input" id="startDate" value="${S.dateISO}">
        </div>
        <div class="field">
          <label>終了日</label>
          <input type="date" class="input" id="endDate" value="${S.dateISO}">
        </div>
        <div class="field">
          <label>部署 <span style="color:#c00;">*</span></label>
          <select class="input" id="deptSelect">
            <option value="">選択してください</option>
            ${deptOptions}
          </select>
        </div>
        <div class="field">
          <label>氏名 <span style="color:#c00;">*</span></label>
          <select class="input" id="workerSelect" disabled>
            <option value="">部署を選択してください</option>
          </select>
        </div>
        <div class="field fullRow">
          <label>メモ（任意）</label>
          <input type="text" class="input" id="memoInput" placeholder="例：客先訪問">
        </div>
        <div id="conflictArea" class="fullRow" style="display:none;"></div>
      </div>
    `;

    const footHtml = `
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn btn--primary" id="submitBtn">予約する</button>
    `;

    openModal(`予約作成：${vehicle.name}`, bodyHtml, footHtml);

    // State for this modal
    let selectedSlot = slot;
    let selectedWorker = null;

    // Slot chip toggle
    const slotChips = document.querySelectorAll('#slotChips .chip');
    slotChips.forEach(chip => {
      chip.addEventListener('click', () => {
        slotChips.forEach(c => c.classList.remove('is-active'));
        chip.classList.add('is-active');
        selectedSlot = chip.dataset.slot;
      });
    });

    // Dept -> Worker loading
    const deptSelect = $('deptSelect');
    const workerSelect = $('workerSelect');

    deptSelect.addEventListener('change', async () => {
      const dept = deptSelect.value;
      workerSelect.innerHTML = '<option value="">読み込み中...</option>';
      workerSelect.disabled = true;
      selectedWorker = null;

      if (!dept) {
        workerSelect.innerHTML = '<option value="">部署を選択してください</option>';
        return;
      }

      try {
        const workers = await apiGetWorkersByDept(dept);
        if (workers.length === 0) {
          workerSelect.innerHTML = '<option value="">作業員が見つかりません</option>';
        } else {
          workerSelect.innerHTML = '<option value="">選択してください</option>' +
            workers.map(w => `<option value="${escapeHtml(w.worker_code)}" data-name="${escapeHtml(w.worker_name)}">${escapeHtml(w.worker_name)}</option>`).join('');
          workerSelect.disabled = false;
        }
      } catch (e) {
        workerSelect.innerHTML = '<option value="">エラーが発生しました</option>';
        toast('エラー', e.message || '作業員取得に失敗');
      }
    });

    workerSelect.addEventListener('change', () => {
      const opt = workerSelect.selectedOptions[0];
      if (opt && opt.value) {
        selectedWorker = {
          worker_code: opt.value,
          worker_name: opt.dataset.name || '',
        };
      } else {
        selectedWorker = null;
      }
    });

    // Cancel
    $('cancelBtn').addEventListener('click', closeModal);

    // Submit
    $('submitBtn').addEventListener('click', async () => {
      const startDate = $('startDate').value;
      const endDate = $('endDate').value;
      const dept = deptSelect.value;

      // Validation
      if (!dept) {
        toast('入力エラー', '部署を選択してください');
        return;
      }
      if (!selectedWorker) {
        toast('入力エラー', '氏名を選択してください');
        return;
      }
      if (!startDate || !endDate) {
        toast('入力エラー', '日付を入力してください');
        return;
      }
      if (startDate > endDate) {
        toast('入力エラー', '終了日は開始日以降にしてください');
        return;
      }

      const payload = {
        vehicle_id: vehicle.vehicle_id,
        start_date: startDate,
        end_date: endDate,
        slot: selectedSlot,
        dept_name: dept,
        worker_code: selectedWorker.worker_code,
        worker_name: selectedWorker.worker_name,
        memo: $('memoInput').value || '',
        source_system: 'webapp',
        source_id: '',
      };

      setSaveState('saving');
      $('submitBtn').disabled = true;
      $('submitBtn').textContent = '保存中...';

      try {
        const res = await apiCreateReservation(payload);
        if (res.ok) {
          toast('予約完了', `${vehicle.name} を予約しました`);
          closeModal();
          await reloadDay();
        } else if (res.code === 'CONFLICT') {
          // Show conflict info
          const conflicts = res.conflicts || [];
          const conflictHtml = `
            <div class="danger">
              <b>予約が競合しています</b>
              <ul class="list">
                ${conflicts.map(c => `<li>${escapeHtml(c.date)} ${escapeHtml(c.slot)}：${escapeHtml(c.existing_dept)} ${escapeHtml(c.existing_name)}</li>`).join('')}
              </ul>
            </div>
          `;
          $('conflictArea').innerHTML = conflictHtml;
          $('conflictArea').style.display = 'block';
          toast('競合エラー', '既に予約があります');
        } else {
          toast('エラー', res.message || '予約に失敗しました');
        }
      } catch (e) {
        toast('エラー', e.message || '予約に失敗しました');
      } finally {
        setSaveState('saved');
        $('submitBtn').disabled = false;
        $('submitBtn').textContent = '予約する';
      }
    });
  }

  // ---------------------------
  // Detail / Cancel modal
  // ---------------------------
  function openDetailModal(vehicle, slotState){
    const bodyHtml = `
      <div class="detailRow">
        <div class="detailLabel">車両</div>
        <div class="detailValue">${escapeHtml(vehicle.name)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">スロット</div>
        <div class="detailValue">${escapeHtml(slotState.slot)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">部署</div>
        <div class="detailValue">${escapeHtml(slotState.dept_name)}</div>
      </div>
      <div class="detailRow">
        <div class="detailLabel">氏名</div>
        <div class="detailValue">${escapeHtml(slotState.worker_name)}</div>
      </div>
      ${slotState.detail ? `
      <div class="detailRow">
        <div class="detailLabel">時間</div>
        <div class="detailValue">${escapeHtml(slotState.detail)}</div>
      </div>
      ` : ''}
      <div class="detailRow" style="border:none; padding-top: 16px;">
        <div class="note">この予約を取り消す場合は「予約取消」を押してください。</div>
      </div>
    `;

    const footHtml = `
      <button class="btn" id="closeDetailBtn">閉じる</button>
      <button class="btn btn--danger" id="cancelReservationBtn">予約取消</button>
    `;

    openModal(`予約詳細：${vehicle.name}`, bodyHtml, footHtml);

    $('closeDetailBtn').addEventListener('click', closeModal);

    $('cancelReservationBtn').addEventListener('click', async () => {
      if (!confirm('この予約を取り消しますか？')) return;

      setSaveState('saving');
      $('cancelReservationBtn').disabled = true;
      $('cancelReservationBtn').textContent = '処理中...';

      try {
        const res = await apiCancelReservation(slotState.reservation_id);
        if (res.ok) {
          toast('取消完了', '予約を取り消しました');
          closeModal();
          await reloadDay();
        } else {
          toast('エラー', res.message || '取消に失敗しました');
        }
      } catch (e) {
        toast('エラー', e.message || '取消に失敗しました');
      } finally {
        setSaveState('saved');
        $('cancelReservationBtn').disabled = false;
        $('cancelReservationBtn').textContent = '予約取消';
      }
    });
  }

  // ---------------------------
  // API wrappers (google.script.run -> Promise)
  // ---------------------------
  function runGAS(fn, ...args){
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fn](...args);
    });
  }

  async function apiInit(dateISO){
    const res = await runGAS('getInit', dateISO);
    return res;
  }
  async function apiGetDay(dateISO){
    const res = await runGAS('getDay', dateISO);
    return res;
  }
  async function apiGetWorkersByDept(dept){
    if (S.workersCache.has(dept)) return S.workersCache.get(dept);
    const res = await runGAS('getWorkersByDept', dept);
    if (!res.ok) throw new Error(res.message || 'getWorkersByDept failed');
    const workers = res.data.workers || [];
    S.workersCache.set(dept, workers);
    return workers;
  }
  async function apiCreateReservation(payload){
    const res = await runGAS('createReservation', payload);
    return res;
  }
  async function apiCancelReservation(reservationId){
    const res = await runGAS('cancelReservation', reservationId);
    return res;
  }

  // ---------------------------
  // Load / Reload
  // ---------------------------
  async function setDateAndLoad(iso){
    S.dateISO = iso;
    $('dateTitleMain').textContent = formatTitle(S.dateISO);
    renderWeekTabs();
    await reloadDay();
  }

  async function reloadDay(){
    setSaveState('saving');
    try{
      const res = await apiGetDay(S.dateISO);
      if (!res.ok){
        toast('エラー', res.message || '当日データ取得に失敗');
        return;
      }
      S.dayReservations = res.data.dayReservations || [];
      renderVehicles();
    } finally {
      setSaveState('saved');
    }
  }

  // ---------------------------
  // Nav buttons
  // ---------------------------
  $('btnPrev').addEventListener('click', () => setDateAndLoad(addDaysISO(S.dateISO, -1)));
  $('btnNext').addEventListener('click', () => setDateAndLoad(addDaysISO(S.dateISO,  1)));
  $('btnToday').addEventListener('click', () => {
    const todayISO = dateToISO(new Date());
    setDateAndLoad(todayISO);
  });

  // ---------------------------
  // Boot
  // ---------------------------
  async function boot(){
    setSaveState('saving');
    try{
      const todayISO = dateToISO(new Date());
      const res = await apiInit(todayISO);
      if (!res.ok){
        toast('エラー', res.message || '初期化に失敗');
        return;
      }
      const data = res.data;
      S.dateISO = data.date;
      S.vehicles = data.vehicles || [];
      S.dayReservations = data.dayReservations || [];
      S.deptList = (data.deptList || []).filter(Boolean);
      $('dateTitleMain').textContent = formatTitle(S.dateISO);

      renderAll();
      toast('準備完了', '当日の予約状況を表示しました');
    } catch(e){
      toast('エラー', String(e?.message || e));
    } finally {
      setSaveState('saved');
    }
  }

  boot();
})();
</script>
